<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>虎码拆分查询</title>
  <link rel="stylesheet" href="base.css" />
  <link rel="preload" href="data/hu_cf.txt.gz" as="fetch" crossorigin />
  <link rel="preload" href="data/zi_py.txt.gz" as="fetch" crossorigin />
  <style>
    header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    h1 {
      font-size: 2rem;
    }

    .nav-link {
      padding: .55rem 1rem;
      border-radius: 12px;
      text-decoration: none;
      color: var(--text-sub);
      font-weight: 600;
      background: rgba(255, 255, 255, .6);
    }

    .nav-link:hover {
      color: var(--primary-color);
      background: #fff;
    }

    .site-nav .nav-link {
      flex: none;
      background: transparent;
    }

    .hint {
      margin: 0 0 1rem;
      color: var(--text-sub);
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 120px;
      padding: 1rem;
      resize: vertical;
      border: 2px solid transparent;
      border-radius: 16px;
      outline: none;
      color: var(--text-main);
      font-family: var(--font-cjk), sans-serif;
      font-size: 1.1rem;
      background: #fff;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, .05);
    }

    textarea:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, .15);
    }

    .summary {
      margin: 1.25rem 0 .75rem;
      color: var(--text-sub);
      font-size: .9rem;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: .8rem;
    }

    .character {
      width: 100%;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: .9rem;
      padding: .65rem .8rem;
      border: 1px solid rgba(255, 255, 255, .65);
      border-radius: 18px;
      background: rgba(255, 255, 255, .68);
    }

    .character-head {
      flex: none;
      min-width: 96px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .15rem;
      padding-right: .8rem;
      border-right: 1px dashed rgba(17, 24, 39, .12);
      transform: translateY(-.63rem);
    }

    .pinyin {
      min-height: 1.1rem;
      white-space: nowrap;
      color: var(--primary-color);
      font-size: .8rem;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .hanzi {
      font-family: var(--font-cjk), sans-serif;
      font-size: 2rem;
      line-height: 1.15;
      font-weight: 700;
    }

    .methods {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
    }

    .method {
      display: flex;
      align-items: center;
      gap: .4rem;
      padding: .24rem .55rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, .55);
    }

    .method.missing {
      opacity: .55;
    }

    .method.pending {
      opacity: .4;
    }

    .method-name {
      flex: none;
      padding: .1rem .5rem;
      border-radius: 999px;
      font-size: .7rem;
      font-weight: 700;
      line-height: 1.6;
      color: #fff;
    }

    .method-radicals {
      flex: 1;
      min-height: 1.5rem;
      color: #374151;
      font-size: 1.15rem;
      overflow-wrap: anywhere;
    }

    .method-radicals.hu {
      font-family: 'TumanPUA', serif;
    }

    .method-radicals.wubi {
      font-family: 'WubiPUA', -apple-system, sans-serif;
    }

    .method-code {
      flex: none;
      color: var(--primary-color);
      font: .7rem Monaco, Consolas, monospace;
      font-weight: 700;
      letter-spacing: .03em;
    }

    .empty {
      width: 100%;
      padding: 3rem 1rem;
      text-align: center;
      color: var(--text-sub);
    }

    @media (max-width: 560px) {
      body {
        padding: 76px 12px 20px;
      }

      .container {
        padding: 1.25rem;
        border-radius: 24px;
      }

      header {
        align-items: center;
        flex-direction: column;
      }

      h1 {
        font-size: 1.65rem;
      }

      .site-nav {
        width: max-content;
      }

      .site-nav .nav-link {
        flex: none;
        padding: .45rem .65rem;
        font-size: .78rem;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <nav class="site-nav" aria-label="主导航">
    <a class="nav-link" href="index.html">虎码练习</a>
    <a class="nav-link" href="table.html">字根表</a>
    <a class="nav-link active" href="split.html">拆分查询</a>
  </nav>
  <main class="container">
    <div class="content">
      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>
      <header>
        <h1>拆分查询</h1>
      </header>
      <p class="hint">输入文字，查看每个字的拼音及虎码、五笔（86/98/新世纪）拆分。</p>
      <textarea id="query" placeholder="例如：你好，世界" autofocus></textarea>
      <p id="summary" class="summary">正在加载数据...</p>
      <section id="results" class="results" aria-live="polite"></section>
    </div>
  </main>
  <script>
    const query = document.getElementById('query');
    const results = document.getElementById('results');
    const summary = document.getElementById('summary');
    const pinyin = new Map();
    const huSplits = new Map();
    const wubiSplits = {'86': new Map(), '98': new Map(), '06': new Map()};

    const METHODS = [
      {key: 'hu', name: '虎码', font: 'hu', color: '#6366f1', bg: '#f7f9ff'},
      {key: '86', name: '86五笔', font: 'wubi', color: '#059669', bg: '#f0fdf6'},
      {key: '98', name: '98五笔', font: 'wubi', color: '#d97706', bg: '#fffaf0'},
      {key: '06', name: '新世纪', font: 'wubi', color: '#dc2626', bg: '#fdf6f6'}
    ];

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, (char) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'})[char]);
    }

    function splitStore(key, char) {
      return key === 'hu' ? huSplits : wubiSplits[key];
    }

    function parseHu(text) {
      text.split(/\r?\n/).forEach((line) => {
        const match = line.match(/^(.+?)\t〔(.+?)&nbsp;·&nbsp;(.+?)〕$/);
        if (match) huSplits.set(match[1], {radical: match[2].replace(/&nbsp;/g, ' '), code: match[3].replace(/&nbsp;/g, ' ')});
      });
    }

    function parsePinyin(text) {
      text.split(/\r?\n/).forEach((line) => {
        const match = line.match(/^(.+?)\s*（(.+)）$/);
        if (match) pinyin.set(match[1], match[2].replace(/&nbsp;/g, ' '));
      });
    }

    // 五笔文件格式：字\t[※拆分※,※编码※,※拼音(可选)※,※字符集※]
    function parseWubi(text, method) {
      text.split(/\r?\n/).forEach((line) => {
        const match = line.match(/^(.+?)\t\[(.*)\]$/);
        if (!match) return;
        const fields = match[2].split(',');
        if (fields.length < 2) return;
        const radicals = fields[0].replace(/^※|※$/g, '').split('※');
        const py = fields.length >= 4 ? fields[2].replace(/^※|※$/g, '').replace(/_/g, ' ') : '';
        wubiSplits[method].set(match[1], {
          radicals: radicals,
          code: fields[1].replace(/^※|※$/g, ''),
          pinyin: py
        });
        if (!pinyin.has(match[1]) && py && !/^\d+$/.test(py)) {
          pinyin.set(match[1], py);
        }
      });
    }

    function methodRow(key, char) {
      const store = splitStore(key, char);
      const item = store.get(char);
      const method = METHODS.find((m) => m.key === key);
      const labelStyle = `style="color:#fff;background:${method.color}"`;
      const codeStyle = `style="color:${method.color}"`;
      const rowStyle = `style="background:${method.bg}"`;
      if (!loadedMethods.has(key)) {
        return `<div class="method pending" ${rowStyle}><span class="method-name" ${labelStyle}>${method.name}</span><span class="method-radicals">加载中…</span><span class="method-code"></span></div>`;
      }
      if (!item) {
        return `<div class="method missing" ${rowStyle}><span class="method-name" ${labelStyle}>${method.name}</span><span class="method-radicals">—</span><span class="method-code"></span></div>`;
      }
      const radicals = key === 'hu' ? item.radical : item.radicals.join(' ');
      return `<div class="method" ${rowStyle}><span class="method-name" ${labelStyle}>${method.name}</span><span class="method-radicals ${method.font}">${escapeHtml(radicals)}</span><span class="method-code" ${codeStyle}>${escapeHtml(item.code)}</span></div>`;
    }

    function render() {
      if (!huReady) return;
      const chars = Array.from(query.value).filter((char) => !/\s/.test(char));
      if (!chars.length) {
        summary.textContent = '输入文字后开始查询';
        results.innerHTML = '<div class="empty">结果会显示在这里</div>';
        return;
      }
      summary.textContent = `共 ${chars.length} 个字符`;
      results.innerHTML = chars.map((char) => {
        const found = METHODS.some((m) => loadedMethods.has(m.key) && splitStore(m.key, char).has(char));
        const rows = METHODS.map((m) => methodRow(m.key, char)).join('');
        return `<article class="character${found ? '' : ' not-found'}"><div class="character-head"><div class="pinyin">${escapeHtml(pinyin.get(char) || '—')}</div><div class="hanzi">${escapeHtml(char)}</div></div><div class="methods">${rows}</div></article>`;
      }).join('');
    }

    function updateProgress() {
      const pct = progress.total ? Math.min(100, (progress.loaded / progress.total) * 100) : 0;
      progressBar.style.width = pct + '%';
    }

    function resetProgress() {
      progress.total = 0;
      progress.loaded = 0;
      updateProgress();
    }

    // 优先加载 .gz，用 DecompressionStream 解压；失败或浏览器不支持时回退原文件
    async function fetchText(url) {
      const gzUrl = url + '.gz';
      const gzRes = await fetch(gzUrl);
      if (gzRes.ok && 'DecompressionStream' in window) {
        const total = +gzRes.headers.get('content-length') || 0;
        if (total) progress.total += total;
        const reader = gzRes.body.getReader();
        const chunks = [];
        for (; ;) {
          const {done, value} = await reader.read();
          if (done) break;
          chunks.push(value);
          if (total) {
            progress.loaded += value.length;
            updateProgress();
          }
        }
        const buf = await new Blob(chunks).arrayBuffer();
        const stream = new Response(buf).body.pipeThrough(new DecompressionStream('gzip'));
        return await new Response(stream).text();
      }
      const plain = await fetch(url);
      if (!plain.ok) throw new Error('数据加载失败');
      return plain.text();
    }

    const loadedMethods = new Set();
    let huReady = false;
    let wubiStarted = false;
    let wubiDone = 0;
    const progress = {total: 0, loaded: 0};
    const progressBar = document.querySelector('.progress-bar');
    const WUBI_FILES = {'86': '86_ws.txt', '98': '98_ws.txt', '06': '06_ws.txt'};

    function ensureWubi() {
      if (wubiStarted) return;
      wubiStarted = true;
      summary.textContent = '正在加载五笔数据...';
      resetProgress();
      Object.keys(WUBI_FILES).forEach((key) => {
        fetchText('data/' + WUBI_FILES[key])
          .then((t) => parseWubi(t, key))
          .then(() => {
            loadedMethods.add(key);
            wubiDone++;
            if (wubiDone === Object.keys(WUBI_FILES).length) {
              progress.loaded = progress.total;
              updateProgress();
            }
            render();
          })
          .catch((err) => {summary.textContent = err.message;});
      });
    }

    async function init() {
      try {
        const [huTxt, pyTxt] = await Promise.all([
          fetchText('data/hu_cf.txt').then((t) => {if (!t) throw new Error('虎码数据加载失败'); return t;}),
          fetchText('data/zi_py.txt').then((t) => {if (!t) throw new Error('拼音数据加载失败'); return t;})
        ]);
        parseHu(huTxt);
        parsePinyin(pyTxt);
        huReady = true;
        loadedMethods.add('hu');
        progress.loaded = progress.total;
        updateProgress();
        render();
        query.addEventListener('input', () => {
          ensureWubi();
          render();
        });
      } catch (error) {
        summary.textContent = error.message;
        results.innerHTML = '<div class="empty">无法加载查询数据，请稍后重试。</div>';
      }
    }
    init();

    // 注册 Service Worker 缓存字体与数据
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>

</html>
