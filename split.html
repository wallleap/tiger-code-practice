<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>虎码拆分查询</title>
  <link rel="stylesheet" href="base.css" />
  <link rel="preload" href="data/hu_cf.txt.gz" as="fetch" crossorigin />
  <link rel="preload" href="data/zi_py.txt.gz" as="fetch" crossorigin />
  <style>
    header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    h1 {
      font-size: 2rem;
    }

    .nav-link {
      padding: .55rem 1rem;
      border-radius: 12px;
      text-decoration: none;
      color: var(--text-sub);
      font-weight: 600;
      background: rgba(255, 255, 255, .6);
    }

    .nav-link:hover {
      color: var(--primary-color);
      background: #fff;
    }

    .site-nav .nav-link {
      flex: none;
      background: transparent;
    }

    .hint {
      margin: 0 0 1rem;
      padding-left: .25rem;
      color: var(--text-sub);
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 120px;
      padding: 1rem;
      resize: vertical;
      border: 2px solid transparent;
      border-radius: 16px;
      outline: none;
      color: var(--text-main);
      font-family: var(--font-cjk), sans-serif;
      font-size: 1.1rem;
      background: #fff;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, .05);
    }

    textarea:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, .15);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 0 0 .75rem;
    }

    .filter-bar {
      margin: .75rem 0;
      padding: .6rem .9rem;
      border: var(--glass-border);
      border-radius: 16px;
      background: rgba(243, 244, 246, .6);
    }

    .filter-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
    }

    .filter-title {
      color: var(--text-sub);
      font-size: .85rem;
      font-weight: 600;
    }

    .filter-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, .85);
      color: var(--text-sub);
      cursor: pointer;
      transition: color .15s, background .15s;
    }

    .filter-toggle:hover {
      color: var(--primary-color);
      background: #fff;
    }

    .filter-toggle:focus-visible {
      outline: 2px solid var(--primary-color);
      outline-offset: 2px;
    }

    .filter-toggle .chevron {
      transition: transform .25s ease;
    }

    .filter-bar.collapsed .filter-toggle .chevron {
      transform: rotate(-90deg);
    }

    .filter-collapse {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows .25s ease;
    }

    .filter-bar.collapsed .filter-collapse {
      grid-template-rows: 0fr;
    }

    .filters {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: .5rem;
      min-height: 0;
      overflow: hidden;
      padding-top: 0;
    }

    .filter-chip {
      position: relative;
      display: flex;
      align-items: center;
      gap: .45rem;
      padding: .4rem .7rem;
      border-radius: 999px;
      color: var(--text-sub);
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      background: rgba(255, 255, 255, .6);
      transition: color .15s, background .15s;
    }

    .filter-chip:hover {
      background: #fff;
      color: var(--primary-color);
    }

    .filter-chip input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .filter-chip .box {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 17px;
      height: 17px;
      border-radius: 5px;
      border: 2px solid #cbd5e1;
      background: #fff;
      transition: border-color .15s, background .15s, box-shadow .15s;
    }

    .filter-chip:hover .box,
    .filter-chip input:focus-visible + .box {
      border-color: var(--primary-color);
    }

    .filter-chip input:checked + .box {
      border-color: var(--primary-color);
      background: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, .15);
    }

    .filter-chip .box::after {
      content: '';
      width: 8px;
      height: 4px;
      border-left: 2px solid transparent;
      border-bottom: 2px solid transparent;
      transform: rotate(-45deg) translateY(-1px);
      transition: border-color .15s;
    }

    .filter-chip input:checked + .box::after {
      border-color: #fff;
    }

    .chip-example {
      font-style: normal;
      font-size: .72rem;
      opacity: .55;
    }

    .summary {
      color: var(--text-sub);
      font-size: .9rem;
      padding-left: .25rem;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: .8rem;
    }

    .character {
      width: 100%;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: .9rem;
      padding: .65rem .8rem;
      border: 1px solid rgba(255, 255, 255, .65);
      border-radius: 18px;
      background: rgba(255, 255, 255, .68);
    }

    .character-head {
      flex: none;
      min-width: 96px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .15rem;
      padding-right: .8rem;
      border-right: 1px dashed rgba(17, 24, 39, .12);
      transform: translateY(-.63rem);
    }

    .pinyin {
      min-height: 1.1rem;
      white-space: nowrap;
      color: var(--primary-color);
      font-size: .8rem;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .hanzi {
      font-family: var(--font-cjk), sans-serif;
      font-size: 2rem;
      line-height: 1.15;
      font-weight: 700;
    }

    .methods {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
    }

    .method {
      display: flex;
      align-items: center;
      gap: .4rem;
      padding: .24rem .55rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, .55);
    }

    .method.missing {
      opacity: .55;
    }

    .method.pending {
      opacity: .4;
    }

    .method-name {
      flex: none;
      padding: .1rem .5rem;
      border-radius: 999px;
      font-size: .7rem;
      font-weight: 700;
      line-height: 1.6;
      color: #fff;
    }

    .method-radicals {
      flex: 1;
      min-height: 1.5rem;
      color: #374151;
      font-size: 1.15rem;
      overflow-wrap: anywhere;
    }

    .method-radicals.hu {
      font-family: 'TumanPUA', 'PF-Root', serif;
    }

    .method-radicals.wubi {
      font-family: 'WubiPUA', -apple-system, sans-serif;
    }

    .method-code {
      flex: none;
      color: var(--primary-color);
      font: .7rem Monaco, Consolas, monospace;
      font-weight: 700;
      letter-spacing: .03em;
    }

    .empty {
      width: 100%;
      padding: 3rem 1rem;
      text-align: center;
      color: var(--text-sub);
    }

    @media (max-width: 560px) {
      body {
        padding: 76px 12px 20px;
      }

      .container {
        padding: 1.25rem;
        border-radius: 24px;
      }

      header {
        align-items: center;
        flex-direction: column;
      }

      h1 {
        font-size: 1.65rem;
      }

      .site-nav {
        width: max-content;
      }

      .site-nav .nav-link {
        flex: none;
        padding: .45rem .65rem;
        font-size: .78rem;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <nav class="site-nav" aria-label="主导航">
    <a class="nav-link" href="index.html">虎码练习</a>
    <a class="nav-link" href="table.html">字根表</a>
    <a class="nav-link active" href="split.html">拆分查询</a>
    <div id="cache-indicator" class="cache-indicator">
      <span id="cache-indicator-text">正在缓存资源</span>
      <span class="bar"><span class="bar-fill" id="cache-indicator-bar"></span></span>
    </div>
  </nav>
  <a class="github-link" href="https://github.com/wallleap/tiger-code-practice" target="_blank" rel="noopener noreferrer" title="GitHub 仓库" aria-label="GitHub 仓库">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.27-.01-1.17-.02-2.12-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.72-1.54-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.69 5.39-5.25 5.68.41.35.77 1.05.77 2.12 0 1.53-.01 2.76-.01 3.14 0 .31.2.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z" />
    </svg>
  </a>
  <main class="container">
    <div class="content">
      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>
      <header>
        <h1>拆分查询</h1>
      </header>
      <p class="hint">输入文字，查看每个字的拼音及虎码、五笔（86/98/新世纪）拆分。</p>
      <textarea id="query" placeholder="例如：你好，世界" autofocus></textarea>
      <div class="filter-bar" id="filter-bar">
        <div class="filter-head">
          <span class="filter-title">过滤选项</span>
          <button type="button" id="filter-toggle" class="filter-toggle" aria-expanded="true" aria-controls="filter-collapse" aria-label="折叠/展开过滤选项">
            <svg class="chevron" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
              <path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
        <div class="filter-collapse" id="filter-collapse">
          <div class="filters">
            <label class="filter-chip">
              <input type="checkbox" id="filter-punct" checked />
              <span class="box" aria-hidden="true"></span>
              <span>过滤标点/特殊符号</span>
            </label>
            <label class="filter-chip">
              <input type="checkbox" id="filter-digit" checked />
              <span class="box" aria-hidden="true"></span>
              <span>过滤数字</span>
            </label>
            <label class="filter-chip">
              <input type="checkbox" id="filter-letter" checked />
              <span class="box" aria-hidden="true"></span>
              <span>过滤字母</span>
            </label>
            <label class="filter-chip">
              <input type="checkbox" id="filter-other-letter" checked />
              <span class="box" aria-hidden="true"></span>
              <span>过滤其他字母 <i class="chip-example">か 가 ㄅ</i></span>
            </label>
            <label class="filter-chip">
              <input type="checkbox" id="filter-mark" checked />
              <span class="box" aria-hidden="true"></span>
              <span>过滤组合音标 <i class="chip-example">e\u0301 a\u0300 o\u0308</i></span>
            </label>
          </div>
        </div>
      </div>
      <div class="toolbar">
        <p id="summary" class="summary">正在加载数据...</p>
      </div>
      <section id="results" class="results" aria-live="polite"></section>
    </div>
  </main>
  <script>
    const query = document.getElementById('query');
    const results = document.getElementById('results');
    const summary = document.getElementById('summary');
    const pinyin = new Map();
    const huSplits = new Map();
    const wubiSplits = {'86': new Map(), '98': new Map(), '06': new Map()};

    const METHODS = [
      {key: 'hu', name: '虎码', font: 'hu', color: '#6366f1', bg: '#f7f9ff'},
      {key: '86', name: '86五笔', font: 'wubi', color: '#059669', bg: '#f0fdf6'},
      {key: '98', name: '98五笔', font: 'wubi', color: '#d97706', bg: '#fffaf0'},
      {key: '06', name: '新世纪', font: 'wubi', color: '#dc2626', bg: '#fdf6f6'}
    ];

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, (char) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'})[char]);
    }

    function splitStore(key, char) {
      return key === 'hu' ? huSplits : wubiSplits[key];
    }

    function parseHu(text) {
      text.split(/\r?\n/).forEach((line) => {
        const match = line.match(/^(.+?)\t〔(.+?)&nbsp;·&nbsp;(.+?)〕$/);
        if (match) huSplits.set(match[1], {radical: match[2].replace(/&nbsp;/g, ' '), code: match[3].replace(/&nbsp;/g, ' ')});
      });
    }

    function parsePinyin(text) {
      text.split(/\r?\n/).forEach((line) => {
        const match = line.match(/^(.+?)\s*（(.+)）$/);
        if (match) pinyin.set(match[1], match[2].replace(/&nbsp;/g, ' '));
      });
    }

    // 五笔文件格式：字\t[※拆分※,※编码※,※拼音(可选)※,※字符集※]
    function parseWubi(text, method) {
      text.split(/\r?\n/).forEach((line) => {
        const match = line.match(/^(.+?)\t\[(.*)\]$/);
        if (!match) return;
        const fields = match[2].split(',');
        if (fields.length < 2) return;
        const radicals = fields[0].replace(/^※|※$/g, '').split('※');
        const py = fields.length >= 4 ? fields[2].replace(/^※|※$/g, '').replace(/_/g, ' ') : '';
        wubiSplits[method].set(match[1], {
          radicals: radicals,
          code: fields[1].replace(/^※|※$/g, ''),
          pinyin: py
        });
        if (!pinyin.has(match[1]) && py && !/^\d+$/.test(py)) {
          pinyin.set(match[1], py);
        }
      });
    }

    function methodRow(key, char) {
      const store = splitStore(key, char);
      const item = store.get(char);
      const method = METHODS.find((m) => m.key === key);
      const labelStyle = `style="color:#fff;background:${method.color}"`;
      const codeStyle = `style="color:${method.color}"`;
      const rowStyle = `style="background:${method.bg}"`;
      if (!loadedMethods.has(key)) {
        return `<div class="method pending" ${rowStyle}><span class="method-name" ${labelStyle}>${method.name}</span><span class="method-radicals">加载中…</span><span class="method-code"></span></div>`;
      }
      if (!item) {
        return `<div class="method missing" ${rowStyle}><span class="method-name" ${labelStyle}>${method.name}</span><span class="method-radicals">—</span><span class="method-code"></span></div>`;
      }
      const radicals = key === 'hu' ? item.radical : item.radicals.join(' ');
      return `<div class="method" ${rowStyle}><span class="method-name" ${labelStyle}>${method.name}</span><span class="method-radicals ${method.font}">${escapeHtml(radicals)}</span><span class="method-code" ${codeStyle}>${escapeHtml(item.code)}</span></div>`;
    }

    function render() {
      if (!huReady) return;
      const chars = Array.from(query.value).filter((char) => {
        if (/\s/.test(char)) return false;
        for (const f of fixedRules) {
          if (f.regex.test(char)) return false;
        }
        for (const f of filterRules) {
          if (f.enabled && f.regex.test(char)) return false;
        }
        return true;
      });
      if (!chars.length) {
        summary.textContent = '输入文字后开始查询';
        results.innerHTML = '<div class="empty">结果会显示在这里</div>';
        return;
      }
      summary.textContent = `共 ${chars.length} 个字符`;
      results.innerHTML = chars.map((char) => {
        const found = METHODS.some((m) => loadedMethods.has(m.key) && splitStore(m.key, char).has(char));
        const rows = METHODS.map((m) => methodRow(m.key, char)).join('');
        return `<article class="character${found ? '' : ' not-found'}"><div class="character-head"><div class="pinyin">${escapeHtml(pinyin.get(char) || '—')}</div><div class="hanzi">${escapeHtml(char)}</div></div><div class="methods">${rows}</div></article>`;
      }).join('');
    }

    function updateProgress() {
      const pct = progress.total ? Math.min(100, (progress.loaded / progress.total) * 100) : 0;
      progressBar.style.width = pct + '%';
    }

    function resetProgress() {
      progress.total = 0;
      progress.loaded = 0;
      updateProgress();
    }

    // 优先加载 .gz，用 DecompressionStream 解压；失败或浏览器不支持时回退原文件
    async function fetchText(url) {
      const gzUrl = url + '.gz';
      const gzRes = await fetch(gzUrl);
      if (gzRes.ok && 'DecompressionStream' in window) {
        const total = +gzRes.headers.get('content-length') || 0;
        if (total) progress.total += total;
        const reader = gzRes.body.getReader();
        const chunks = [];
        for (; ;) {
          const {done, value} = await reader.read();
          if (done) break;
          chunks.push(value);
          if (total) {
            progress.loaded += value.length;
            updateProgress();
          }
        }
        const buf = await new Blob(chunks).arrayBuffer();
        const stream = new Response(buf).body.pipeThrough(new DecompressionStream('gzip'));
        return await new Response(stream).text();
      }
      const plain = await fetch(url);
      if (!plain.ok) throw new Error('数据加载失败');
      return plain.text();
    }

    const loadedMethods = new Set();
    let huReady = false;
    let wubiStarted = false;
    let wubiDone = 0;
    const progress = {total: 0, loaded: 0};
    const progressBar = document.querySelector('.progress-bar');
    const WUBI_FILES = {'86': '86_ws.txt', '98': '98_ws.txt', '06': '06_ws.txt'};

    const filterRules = [
      {id: 'filter-punct', key: 'split-filter-punct', regex: /[\p{P}\p{S}]/u},
      {id: 'filter-digit', key: 'split-filter-digit', regex: /(?!\u3007)\p{N}/u},
      {id: 'filter-letter', key: 'split-filter-letter', regex: /\p{Lu}|\p{Ll}/u},
      {id: 'filter-other-letter', key: 'split-filter-other-letter', regex: /(?![\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff\u{20000}-\u{2fa1f}])\p{Lo}/u},
      {id: 'filter-mark', key: 'split-filter-mark', regex: /\p{M}/u}
    ];
    const fixedRules = [{regex: /\p{Cf}/u}];
    filterRules.forEach((rule) => {
      const el = document.getElementById(rule.id);
      rule.enabled = localStorage.getItem(rule.key) !== 'off';
      el.checked = rule.enabled;
      el.addEventListener('change', () => {
        rule.enabled = el.checked;
        localStorage.setItem(rule.key, rule.enabled ? 'on' : 'off');
        render();
      });
    });

    const filterBar = document.getElementById('filter-bar');
    const filterToggle = document.getElementById('filter-toggle');
    if (localStorage.getItem('split-filter-collapsed') === '1') {
      filterBar.classList.add('collapsed');
      filterToggle.setAttribute('aria-expanded', 'false');
    }
    filterToggle.addEventListener('click', () => {
      const collapsed = filterBar.classList.toggle('collapsed');
      filterToggle.setAttribute('aria-expanded', String(!collapsed));
      localStorage.setItem('split-filter-collapsed', collapsed ? '1' : '0');
    });

    function ensureWubi() {
      if (wubiStarted) return;
      wubiStarted = true;
      summary.textContent = '正在加载五笔数据...';
      resetProgress();
      Object.keys(WUBI_FILES).forEach((key) => {
        fetchText('data/' + WUBI_FILES[key])
          .then((t) => parseWubi(t, key))
          .then(() => {
            loadedMethods.add(key);
            wubiDone++;
            if (wubiDone === Object.keys(WUBI_FILES).length) {
              progress.loaded = progress.total;
              updateProgress();
            }
            render();
          })
          .catch((err) => {summary.textContent = err.message;});
      });
    }

    async function init() {
      try {
        const [huTxt, pyTxt] = await Promise.all([
          fetchText('data/hu_cf.txt').then((t) => {if (!t) throw new Error('虎码数据加载失败'); return t;}),
          fetchText('data/zi_py.txt').then((t) => {if (!t) throw new Error('拼音数据加载失败'); return t;})
        ]);
        parseHu(huTxt);
        parsePinyin(pyTxt);
        huReady = true;
        loadedMethods.add('hu');
        progress.loaded = progress.total;
        updateProgress();
        render();
        query.addEventListener('input', () => {
          ensureWubi();
          render();
        });
      } catch (error) {
        summary.textContent = error.message;
        results.innerHTML = '<div class="empty">无法加载查询数据，请稍后重试。</div>';
      }
    }
    init();

    // 注册 Service Worker 缓存字体与数据
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(sendPrecacheWhenIdle);
      setupCacheProgress();
    }

    function setupCacheProgress() {
      const el = document.getElementById('cache-indicator');
      const textEl = document.getElementById('cache-indicator-text');
      const barEl = document.getElementById('cache-indicator-bar');
      let doneTimer;
      const hide = () => {
        el.classList.remove('visible');
        el.classList.remove('done');
      };
      navigator.serviceWorker.addEventListener('message', (e) => {
        const d = e.data;
        if (!d || d.type !== 'PRECACHE_PROGRESS') return;
        const pct = d.total ? Math.round((d.done / d.total) * 100) : 100;
        barEl.style.width = pct + '%';
        if (d.done >= d.total) {
          textEl.textContent = d.failed ? `缓存完成（${d.failed} 项跳过）` : '缓存完成';
          el.classList.add('done');
          clearTimeout(doneTimer);
          doneTimer = setTimeout(hide, 3000);
        } else {
          el.classList.remove('done');
          textEl.textContent = `正在缓存资源 ${d.done}/${d.total}`;
          el.classList.add('visible');
        }
      });
    }

    function sendPrecacheWhenIdle() {
      const send = () => {
        const controller = navigator.serviceWorker.controller;
        if (controller) {
          controller.postMessage({type: 'PRECACHE'});
        } else {
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            const c = navigator.serviceWorker.controller;
            if (c) c.postMessage({type: 'PRECACHE'});
          }, {once: true});
        }
      };
      if ('requestIdleCallback' in window) {
        window.requestIdleCallback(send, {timeout: 20000});
      } else {
        setTimeout(send, 5000);
      }
    }
  </script>
</body>
