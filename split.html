<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>虎码拆分查询</title>
  <style>
    @font-face {
      font-family: 'TumanPUA';
      src: url('fonts/TumanPUA.ttf') format('truetype');
    }

    :root {
      --primary: #6366f1;
      --text: #111827;
      --sub: #6b7280;
      --card: rgba(255, 255, 255, .86);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 100px 20px 40px;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #e0e7ff, #f3f4f6);
    }

    .container {
      width: min(900px, 100%);
      margin: auto;
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 32px;
      background: var(--card);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, .1);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      background: linear-gradient(to right, var(--primary), #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-link {
      padding: .55rem 1rem;
      border-radius: 12px;
      text-decoration: none;
      color: var(--sub);
      font-weight: 600;
      background: rgba(255, 255, 255, .6);
    }

    .nav-link:hover {
      color: var(--primary);
      background: #fff;
    }

    .site-nav {
      display: flex;
      gap: .25rem;
      position: fixed;
      top: 12px;
      left: 50%;
      z-index: 100;
      width: max-content;
      max-width: calc(100% - 24px);
      padding: .3rem;
      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 999px;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 8px 20px rgba(17, 24, 39, .12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transform: translateX(-50%);
    }

    .site-nav .nav-link {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: .5rem .9rem;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      font-size: .85rem;
      white-space: nowrap;
    }

    .site-nav .active {
      color: #fff;
      background: var(--primary);
    }

    .hint {
      margin: 0 0 1rem;
      color: var(--sub);
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 120px;
      padding: 1rem;
      resize: vertical;
      border: 2px solid transparent;
      border-radius: 16px;
      outline: none;
      color: var(--text);
      font: inherit;
      font-size: 1.1rem;
      background: #fff;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, .05);
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, .15);
    }

    .summary {
      margin: 1.25rem 0 .75rem;
      color: var(--sub);
      font-size: .9rem;
    }

    .results {
      display: flex;
      flex-wrap: wrap;
      gap: .8rem;
    }

    .character {
      width: 104px;
      min-height: 132px;
      padding: .75rem .5rem;
      border: 1px solid rgba(255, 255, 255, .65);
      border-radius: 18px;
      text-align: center;
      background: rgba(255, 255, 255, .68);
    }

    .pinyin {
      min-height: 1.3rem;
      color: var(--primary);
      font-size: .85rem;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .hanzi {
      margin: .2rem 0;
      font-size: 2.2rem;
      line-height: 1.15;
      font-weight: 700;
    }

    .radical {
      min-height: 1.5rem;
      color: #374151;
      font-family: 'TumanPUA', -apple-system, sans-serif;
      font-size: 1.15rem;
      overflow-wrap: anywhere;
    }

    .code {
      margin-top: .35rem;
      color: var(--sub);
      font: .75rem Monaco, Consolas, monospace;
    }

    .not-found .radical,
    .not-found .code {
      color: #9ca3af;
      font-family: inherit;
    }

    .empty {
      width: 100%;
      padding: 3rem 1rem;
      text-align: center;
      color: var(--sub);
    }

    @media (max-width: 560px) {
      body {
        padding: 76px 12px 20px;
      }

      .container {
        padding: 1.25rem;
        border-radius: 24px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      h1 {
        font-size: 1.65rem;
      }

      .site-nav {
        width: max-content;
      }

      .site-nav .nav-link {
        flex: none;
        padding: .45rem .65rem;
        font-size: .78rem;
        text-align: center;
      }

      .character {
        width: calc(25% - .6rem);
        min-width: 72px;
      }
    }
  </style>
</head>

<body>
  <nav class="site-nav" aria-label="主导航">
    <a class="nav-link" href="index.html">虎码练习</a>
    <a class="nav-link" href="table.html">字根表</a>
    <a class="nav-link active" href="split.html">拆分查询</a>
  </nav>
  <main class="container">
    <header>
      <h1>拆分查询</h1>
    </header>
    <p class="hint">输入文字，查看每个字的拼音和虎码拆分。</p>
    <textarea id="query" placeholder="例如：你好，世界" autofocus></textarea>
    <p id="summary" class="summary">正在加载数据...</p>
    <section id="results" class="results" aria-live="polite"></section>
  </main>
  <script>
    const query = document.getElementById('query');
    const results = document.getElementById('results');
    const summary = document.getElementById('summary');
    const decompositions = new Map();
    const pinyin = new Map();

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, (char) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'})[char]);
    }

    function parseDecompositions(text) {
      text.split(/\r?\n/).forEach((line) => {
        const match = line.match(/^(.+?)\t〔(.+?)&nbsp;·&nbsp;(.+?)〕$/);
        if (match) decompositions.set(match[1], {radical: match[2].replace(/&nbsp;/g, ' '), code: match[3]});
      });
    }

    function parsePinyin(text) {
      text.split(/\r?\n/).forEach((line) => {
        const match = line.match(/^(.+?)\s*（(.+)）$/);
        if (match) pinyin.set(match[1], match[2].replace(/&nbsp;/g, ' '));
      });
    }

    function render() {
      const chars = Array.from(query.value).filter((char) => !/\s/.test(char));
      if (!chars.length) {
        summary.textContent = '输入文字后开始查询';
        results.innerHTML = '<div class="empty">结果会显示在这里</div>';
        return;
      }
      summary.textContent = `共 ${chars.length} 个字符`;
      results.innerHTML = chars.map((char) => {
        const item = decompositions.get(char);
        return `<article class="character${item ? '' : ' not-found'}"><div class="pinyin">${escapeHtml(pinyin.get(char) || '—')}</div><div class="hanzi">${escapeHtml(char)}</div><div class="radical">${escapeHtml(item ? item.radical : '暂无拆分')}</div><div class="code">${escapeHtml(item ? item.code : '')}</div></article>`;
      }).join('');
    }

    async function init() {
      try {
        const [decompositionResponse, pinyinResponse] = await Promise.all([fetch('data/hu_cf.txt'), fetch('data/zi_py.txt')]);
        if (!decompositionResponse.ok || !pinyinResponse.ok) throw new Error('数据加载失败');
        parseDecompositions(await decompositionResponse.text());
        parsePinyin(await pinyinResponse.text());
        render();
        query.addEventListener('input', render);
      } catch (error) {
        summary.textContent = error.message;
        results.innerHTML = '<div class="empty">无法加载查询数据，请稍后重试。</div>';
      }
    }
    init();
  </script>
</body>

</html>
